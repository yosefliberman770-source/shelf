<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://covers.openlibrary.org https://*.archive.org; connect-src 'self' https://openlibrary.org; worker-src 'self'; manifest-src 'self'">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1310" media="(prefers-color-scheme: dark)">
<meta name="description" content="Track your books, seforim, shiurim, audiobooks, podcasts and courses, with deep reading stats.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Shelfmark</title>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="26" height="32" viewBox="0 0 26 32" aria-hidden="true"><rect x="1" y="1" width="24" height="30" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M14 1v15l3.5-3 3.5 3V1" fill="var(--gold)"/></svg>
      <div><h1>Shelfmark</h1><div class="date" id="today-label"></div></div>
    </div>
    <div class="btn-row"><span class="sync" id="sync" data-s="idle" hidden><i></i><span></span></span>
      <button class="iconbtn" data-a="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <div id="timer-slot"></div>
  <div id="banner"></div>
  <main id="main"><div class="loading">Opening your library…</div></main>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>Today</button>
  <button role="tab" data-tab="library" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16.2 5.2l3.8-1 3.4 14.6-3.8 1z" transform="translate(-2.5 .3)"/></svg>Library</button>
  <button role="tab" data-tab="journal" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M5 18a3 3 0 0 1 3-3h11M9 7h6M9 10.5h4"/></svg>Journal</button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>Stats</button>
  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14.5h3M13.5 17.5h3"/></svg>Plan</button>
</nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="gr-file" accept=".csv,text/csv" hidden>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/stats.js"></script>
<script src="js/plan.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
