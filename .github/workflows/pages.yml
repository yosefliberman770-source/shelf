name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/atlas-build/requirements.txt
      - run: python -m pip install -r scripts/atlas-build/requirements.txt
      - run: npm ci
      - run: npm test
      - name: Data build tests (Python)
        run: python -m unittest discover -s scripts/atlas-build -p 'test_*.py'
      - name: Build for https://<user>.github.io/<repo>/
        run: npx vite build
        env:
          SHELF_BASE: /${{ github.event.repository.name }}/
      # The files about to be published, checked for private data (the same test skips when there is no build).
      - name: Check the build ships nothing private
        run: npx vitest run src/atlas/private-data.test.ts -t "production build"
        env:
          SHELF_REQUIRE_BUILD: '1'
      # Single-page app: serve index.html for deep links too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
