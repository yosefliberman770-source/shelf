name: Tests

# The same checks as the deploy, on every pull request, so a failure shows up before merging.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/atlas-build/requirements.txt
      - run: python -m pip install -r scripts/atlas-build/requirements.txt
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - name: Data build tests (Python)
        run: python -m unittest discover -s scripts/atlas-build -p 'test_*.py'
      - run: npx vite build
      - name: Check the build ships nothing private
        run: npx vitest run src/atlas/private-data.test.ts -t "production build"
        env:
          SHELF_REQUIRE_BUILD: '1'
